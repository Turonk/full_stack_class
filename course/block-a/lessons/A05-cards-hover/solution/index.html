<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse FM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <p class="logo">Pulse FM</p>
    <nav>
      <a class="is-current" href="#hero">Эфир</a>
      <a href="#tracks">Треки</a>
      <a href="#club">Клуб</a>
    </nav>
  </header>
  <main>
    <section class="hero" id="hero">
      <h1>Радио, которое собираешь сам</h1>
      <p class="tagline">Ночной эфир · три плитки, которые умеют отвечать</p>
      <a class="btn" href="#tracks">Слушать</a>
    </section>
    <section id="tracks">
      <h2 class="section-title">Сейчас в эфире</h2>
      <div class="row">
        <article class="card">
          <img class="cover-img" src="https://picsum.photos/seed/pixeltide/400/400" alt="Обложка Pixel Tide">
          <h3>Pixel Tide</h3>
          <p class="muted">Nova Park · 3:14</p>
          <a class="card-link" href="#hero">Открыть</a>
        </article>
        <article class="card">
          <img class="cover-img" src="https://picsum.photos/seed/lowbattery/400/400" alt="Обложка Low Battery">
          <h3>Low Battery</h3>
          <p class="muted">Kite Club · 2:47</p>
          <a class="card-link" href="#hero">Открыть</a>
        </article>
        <article class="card">
          <img class="cover-img" src="https://picsum.photos/seed/afterbell/400/400" alt="Обложка After Bell">
          <h3>After Bell</h3>
          <p class="muted">Школьный коридор · 4:02</p>
          <a class="card-link" href="#hero">Открыть</a>
        </article>
      </div>
    </section>
    <p id="club" class="club">Клуб PulseLab · учебный эфир 2026</p>
  </main>
</body>
</html>
