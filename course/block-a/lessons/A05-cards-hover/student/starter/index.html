<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse FM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <p class="logo">Pulse FM</p>
    <nav>
      <a class="is-current" href="#hero">Эфир</a>
      <a href="#tracks">Треки</a>
      <a href="#club">Клуб</a>
    </nav>
  </header>
  <main>
    <section class="hero" id="hero">
      <h1>Радио, которое собираешь сам</h1>
      <p class="tagline">Ночной эфир · synth и коридор после звонка</p>
      <a class="btn" href="#tracks">Слушать</a>
    </section>
    <article class="card" id="tracks">
      <img class="cover-img" src="https://picsum.photos/seed/pixeltide/400/400" width="400" height="400" alt="Обложка Pixel Tide">
      <h2>Pixel Tide</h2>
      <p class="muted">Nova Park · 3:14</p>
    </article>
    <p id="club" class="club">Клуб PulseLab · учебный эфир 2026</p>
  </main>
</body>
</html>
