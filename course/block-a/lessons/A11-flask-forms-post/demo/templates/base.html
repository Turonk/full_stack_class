<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>PulseDeck Stand · A11</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="top">
    <a class="logo" href="{{ url_for('home') }}">PulseDeck Stand</a>
    <nav>
      <a href="{{ url_for('home') }}">Каталог</a>
      <a href="{{ url_for('suggest') }}">Предложить</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-box">
        {% for msg in messages %}
          <p class="flash">{{ msg }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
