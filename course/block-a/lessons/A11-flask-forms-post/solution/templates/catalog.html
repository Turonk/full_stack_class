{% extends "base.html" %}

{% block content %}
<h1>Полный каталог эфира</h1>
<div class="row">
  {% for item in items %}
    <article class="card">
      <h3>{{ item.title }}</h3>
      <p class="muted">{{ item.subtitle }} · {{ item.meta }}</p>
      <p>{{ item.blurb }}</p>
    </article>
  {% endfor %}
</div>
{% endblock %}
