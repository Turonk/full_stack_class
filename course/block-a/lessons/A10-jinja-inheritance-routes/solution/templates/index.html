{% extends "base.html" %}

{% block content %}
<section class="hero">
  <h1>Pulse FM · Эфир</h1>
  <p class="muted">Серверный сайт с динамическими страницами треков.</p>
</section>

<div class="row">
  {% for item in items %}
    <article class="card">
      <h3>{{ item.title }}</h3>
      <p class="muted">{{ item.subtitle }} · {{ item.meta }}</p>
      <a class="card-link" href="{{ url_for('item_page', item_id=item.id) }}">Подробнее →</a>
    </article>
  {% endfor %}
</div>
{% endblock %}
