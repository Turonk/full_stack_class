<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Pulse FM · Каталог</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <h1>Полный каталог эфира</h1>
  <div class="row">
    {% for item in items %}
      <article class="card">
        <h3>{{ item.title }}</h3>
        <p class="muted">{{ item.subtitle }} · {{ item.meta }}</p>
        <p class="blurb">{{ item.blurb }}</p>
      </article>
    {% endfor %}
  </div>
</body>
</html>
