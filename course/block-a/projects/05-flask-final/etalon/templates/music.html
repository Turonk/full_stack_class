{% extends "base.html" %}
{% block title %}Музыка{% endblock %}
{% block content %}
<h1>Эфир</h1>
<div class="grid">
  {% for t in tracks %}
  <article class="card">
    <h2>{{ t.title }}</h2>
    <p class="muted">{{ t.artist }} · {{ t.length }}</p>
  </article>
  {% endfor %}
</div>
{% endblock %}
