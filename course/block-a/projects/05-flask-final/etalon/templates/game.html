{% extends "base.html" %}
{% block title %}PulseBeat{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
{% endblock %}
{% block content %}
<h1>PulseBeat</h1>
<p>Счёт: <span id="score">0</span> · Жизни: <span id="lives">3</span> · Время: <span id="time">30</span></p>
<div id="pads" class="pads"></div>
<p>
  <button id="start" type="button">Старт</button>
  <button id="restart" type="button">Рестарт</button>
</p>
<p id="status" role="status"></p>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/game.js') }}" defer></script>
{% endblock %}
