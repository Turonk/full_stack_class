{% extends "base.html" %}

{% block title %}Предложить трек · Pulse FM{% endblock %}

{% block content %}
<section class="form-box">
  <h1>Предложить трек в эфир</h1>
  <p class="muted">Форма отправляет POST-запрос на сервер, Flask валидирует данные и дополняет список в памяти.</p>

  <form method="post" action="{{ url_for('suggest') }}">
    <div class="field">
      <label for="title">Название трека *</label>
      <input type="text" id="title" name="title" placeholder="Например: Neon Sunset" required>
    </div>

    <div class="field">
      <label for="subtitle">Исполнитель / игра</label>
      <input type="text" id="subtitle" name="subtitle" placeholder="Например: Retro Wave Band">
    </div>

    <div class="field">
      <label for="meta">Длительность / мета</label>
      <input type="text" id="meta" name="meta" placeholder="Например: 3:20">
    </div>

    <div class="field">
      <label for="img">Обложка</label>
      <select id="img" name="img">
        <option value="pixel.svg">Неон Pixel (фиолетовый)</option>
        <option value="battery.svg">Батарея (бирюзовый)</option>
        <option value="bell.svg">Школа (оранжевый)</option>
        <option value="drift.svg">Дрифт (синий)</option>
      </select>
    </div>

    <div class="field">
      <label for="blurb">Короткое описание</label>
      <textarea id="blurb" name="blurb" rows="3" placeholder="Почему этот трек должен быть в эфире..."></textarea>
    </div>

    <button type="submit" class="btn">Отправить в ротацию</button>
  </form>
</section>
{% endblock %}
