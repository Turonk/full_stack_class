<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseDeck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <p class="mark">PulseDeck</p>
    <nav>
      <a class="on" href="#library">Библиотека</a>
      <a href="#friends">Друзья</a>
      <a href="#shop">Магазин</a>
    </nav>
  </header>
  <main id="library">
    <h1>Недавние игры</h1>
    <div class="shelf">
      <article class="tile">
        <img src="https://picsum.photos/seed/nc1/400/400" alt="Night Circuit">
        <h2>Night Circuit</h2>
        <a href="#play">Play</a>
      </article>
      <article class="tile">
        <img src="https://picsum.photos/seed/nc2/400/400" alt="Low Orbit">
        <h2>Low Orbit</h2>
        <a href="#play">Play</a>
      </article>
      <article class="tile">
        <img src="https://picsum.photos/seed/nc3/400/400" alt="After Bell">
        <h2>After Bell</h2>
        <a href="#play">Play</a>
      </article>
    </div>
  </main>
</body>
</html>
